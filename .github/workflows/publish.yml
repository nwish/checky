name: Build and publish container

on:
  # Manual run: publishes an image tagged with the commit SHA only (never "latest").
  workflow_dispatch:
  # Release: pushing a v* tag (e.g. v0.4.0) publishes <tag> and "latest".
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rerun
          flavor: |
            latest=${{ github.event_name == 'push' }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
