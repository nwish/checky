name: Build and publish container

on:
  # Manual run: publishes an image tagged with the commit SHA only (never "latest").
  workflow_dispatch:
  # Release: pushing a version tag (v0.1.0, v1.2.3, v0.2.0-rc.1) publishes semver tags.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rerun
          # v1.2.3 -> 1.2.3, 1.2, 1, latest. Pre-releases (v1.2.3-rc.1) get only their exact
          # version, never latest. Major version zero gets no "0" tag (0.y.z can break at any time).
          # Manual runs have no tag, so they only get the sha tag.
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
